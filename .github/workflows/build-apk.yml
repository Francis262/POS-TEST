name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner za izdelavo APK (self-hosted potrebuje Flutter/Android SDK podporo)"
        type: choice
        required: true
        default: ubuntu-latest
        options:
          - ubuntu-latest
          - self-hosted

permissions:
  contents: read

jobs:
  build-apk:
    name: Flutter Android release APK
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Python for Android configuration
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable
          cache: true

      - name: Generate Android project
        run: flutter create --platforms=android --project-name=pos_skener --org=si.lacantina --no-pub .

      - name: Configure Android (camera and minSdk)
        run: python scripts/configure_android.py

      - name: Download Flutter dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: pos-skener-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
